apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: datadog-agent
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: gitea-platform
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://helm.datadoghq.com'
    chart: datadog
    targetRevision: '3.67.2'
    helm:
      releaseName: datadog
      values: |
__DATADOG_VALUES__
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: datadog
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
