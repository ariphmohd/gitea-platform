# ==============================================================================
# Prometheus & Grafana Stack Values (kube-prometheus-stack)
# Tailored for AWS EKS Cluster with Multi-AZ Node & Gitea Metrics Scraping
# ==============================================================================

# Core Prometheus Operator Configuration
crds:
  enabled: false

prometheusOperator:
  enabled: true
  admissionWebhooks:
    enabled: false
    patch:
      enabled: false
  tls:
    enabled: false

defaultRules:
  create: true
  rules:
    etcd: false
    kubeScheduler: false
    kubeControllerManager: false

# Kubelet & cAdvisor metrics for AWS EKS Container/Pod Metrics
kubelet:
  enabled: true
  serviceMonitor:
    cAdvisor: true
    resource: true
    probes: true

# CoreDNS metrics
coreDns:
  enabled: true

# API Server metrics
kubeApiServer:
  enabled: true

prometheus:
  prometheusSpec:
    retention: ${PROMETHEUS_RETENTION_DAYS}d
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelector: {}
    serviceMonitorNamespaceSelector: {}
    podMonitorSelectorNilUsesHelmValues: false
    podMonitorSelector: {}
    podMonitorNamespaceSelector: {}
    ruleSelectorNilUsesHelmValues: false
    ruleSelector: {}
    ruleNamespaceSelector: {}
    
    resources:
      requests:
        cpu: 150m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 1Gi

    # Additional Scrape Config for Gitea Metrics
    additionalScrapeConfigs:
      - job_name: 'gitea'
        metrics_path: '/metrics'
        scrape_interval: 15s
        static_configs:
          - targets: ['gitea-http.gitea.svc.cluster.local:3000']
            labels:
              app: gitea
              environment: prod

# Grafana Dashboard & Visualization
grafana:
  enabled: true
  adminUser: "${GRAFANA_ADMIN_USER}"
  adminPassword: "${GRAFANA_ADMIN_PASSWORD}"
  defaultDashboardsEnabled: true
  defaultDashboardsEditable: true

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 300m
      memory: 512Mi

  service:
    type: ClusterIP
    port: 80

  dashboards:
    default:
      gitea-overview:
        gnetId: 14757
        revision: 1
        datasource: Prometheus

  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: ""
      searchNamespace: ALL
    datasources:
      enabled: true
      defaultDatasourceEnabled: true
      isDefaultDatasource: true

# Alertmanager Configuration
alertmanager:
  enabled: true
  alertmanagerSpec:
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi

# Node Exporter for EC2 Host Metrics
nodeExporter:
  enabled: true

# Kube State Metrics for Kubernetes Resource Monitoring
kubeStateMetrics:
  enabled: true
