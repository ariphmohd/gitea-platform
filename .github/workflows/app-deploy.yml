name: Deploy Gitea Application to EKS

on:
  push:
    branches: [main]
    paths:
      - 'helm/**'
      - 'k8s/**'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Helm Deploy to EKS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.14.4'

      - name: Setup Kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.30.0'

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ap-south-1
          # role-to-assume: arn:aws:iam::123456789012:role/github-actions-eks-deploy-role

      - name: Update Kubeconfig
        run: |
          aws eks update-kubeconfig --region ap-south-1 --name gitea-eks-cluster

      - name: Deploy Gitea Helm Chart
        run: |
          helm repo add gitea-charts https://dl.gitea.com/charts/
          helm repo update
          helm upgrade --install gitea gitea-charts/gitea \
            --namespace gitea \
            --create-namespace \
            --values ./helm/gitea-values.yaml
